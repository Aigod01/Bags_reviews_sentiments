server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Single-page app: any unknown path falls back to index.html so React Router
    # (client-side routing) can handle it instead of nginx returning a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed build assets; index.html itself is never cached
    # so users always get the latest build reference.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
